<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="AXI x peaq partnership banner">
  <title>AXI x peaq</title>
  <defs>
    <linearGradient id="axi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18E299"/>
      <stop offset="100%" stop-color="#14B57E"/>
    </linearGradient>
    <linearGradient id="peaq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B5BE6"/>
      <stop offset="100%" stop-color="#7B5BFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" fill="#FFFFFF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-3">
    <text x="180" y="155" font-size="120" fill="url(#axi)">AXI</text>
    <text x="540" y="148" font-size="64" font-weight="300" fill="#9CA3AF">×</text>
    <text x="640" y="155" font-size="120" fill="url(#peaq)">peaq</text>
  </g>
</svg>
